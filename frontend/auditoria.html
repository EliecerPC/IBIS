
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBIS | Auditoría</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado">
        <h1>IBIS</h1>
    </header>

    <div class="contenedor">

        <aside class="barra-lateral">

            <a href="index.html" class="boton-menu">
                Inicio
            </a>

            <a href="consultar.html" class="boton-menu">
                Consultar
            </a>

            <a href="formulario.html" class="boton-menu"
               data-roles="Administrador,Coordinacion,Area encargada">
                Agregar equipo
            </a>

            <a href="usuarios.html" class="boton-menu"
               data-roles="Administrador">
                Usuarios
            </a>

            <a href="auditoria.html" class="boton-menu activo"
               data-roles="Administrador">
                Auditoría
            </a>

            <div id="sesionInfo" class="sesion-info"></div>

        </aside>

        <main class="contenido-inventario">

            <section class="listado">

                <div class="encabezado-auditoria">

                    <h2>Historial de auditoría</h2>

                    <p>
                        Consulta las operaciones realizadas sobre los equipos
                        registrados en IBIS.
                    </p>

                    <p id="mensajeAuditoria">
                        Cargando historial...
                    </p>
                </div>

                <div id="listaAuditoria" class="contenedor-tabla-auditoria">
                    <table id="tablaAuditoria">
                        <thead>
                            <tr>
                                <th>Fecha y hora</th>
                                <th>Usuario</th>
                                <th>Acción</th>
                                <th>Equipo</th>
                                <th>Detalles</th>
                            </tr>
                        </thead>

                        <tbody id="cuerpoAuditoria">
                        </tbody>
                    </table>
                </div>

            </section>

        </main>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/auditoria.js"></script>

</body>

</html>
