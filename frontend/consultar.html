
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IBIS | Consultar Inventario</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado">
        <h1>IBIS</h1>
    </header>

    <div class="contenedor">

        <aside class="barra-lateral">

            <a href="index.html" class="boton-menu">
                Inicio
            </a>

            <a href="consultar.html" class="boton-menu activo">
                Consultar
            </a>

            <a href="formulario.html" class="boton-menu">
                Agregar equipo
            </a>

        </aside>

        <main class="contenido-inventario">

            <section class="listado">

                <h2>Consultar equipos</h2>

                <div class="filtros">

                    <div class="campo-busqueda">
                        <input
                            type="text"
                            id="buscar"
                            placeholder="Buscar por código, nombre, serial, marca o modelo..."
                        >

                        <button
                            id="btnBuscar"
                            type="button"
                            aria-label="Buscar"
                        >
                            🔍
                        </button>
                    </div>

                    <div class="campo-filtro">
                        <label for="filtroTipo">Tipo</label>

                        <select id="filtroTipo">
                            <option value="">Todos</option>
                        </select>
                    </div>

                    <div class="campo-filtro">
                        <label for="filtroEstado">Estado</label>

                        <select id="filtroEstado">
                            <option value="">Todos</option>
                        </select>
                    </div>

                    <button
                        id="btnLimpiarFiltros"
                        type="button"
                    >
                        Limpiar filtros
                    </button>

                </div>

                <div id="listaEquipos">

                    <table id="tablaEquipos">

                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Estado</th>
                                <th>Ubicación</th>
                                <th>Observaciones</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="cuerpoTabla">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <!--<footer class="footer">
        <p>Universidad del Tolima - CAT Girardot</p>
    </footer>-->

    <script src="js/app.js"></script>

</body>

</html>
