
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IBIS | Iniciar sesión</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="encabezado">
        <h1>IBIS</h1>
    </header>

    <main class="contenido-login">

        <img src="ibis.svg" alt="" class="logo-login">

        <section class="login-card">

            <h2>Iniciar sesión</h2>
            <p class="login-subtitulo">Sistema Web de Gestión de Inventario</p>

            <form id="formLogin">

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="usuario@ut.edu.co"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required
                    >
                </div>

                <button id="btnIngresar" type="submit">Ingresar</button>

                <p id="mensajeLogin" class="login-mensaje" hidden></p>

            </form>

        </section>

    </main>

    <script src="js/auth.js"></script>
</body>

</html>
