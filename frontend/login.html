<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBIS | Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-body">

    <main class="login-container">
        
        <!-- Columna Izquierda: Ilustración -->
        <section class="login-left">
            <img src="ibis2.svg" alt="Ilustración IBIS" class="logo-login">
        </section>

        <!-- Columna Derecha: Formulario -->
        <section class="login-right">
            
            <h1 class="login-titulo">IBIS</h1>
            <p class="login-subtitulo">Gestión de Inventario</p>

            <form id="formLogin" class="form-login">

                <div class="campo-horizontal">
                    <label for="correo">Usuario</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required
                    >
                </div>

                <div class="campo-horizontal">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required
                    >
                </div>

                <div class="contenedor-btn">
                    <button id="btnIngresar" type="submit">INGRESAR</button>
                </div>

                <p id="mensajeLogin" class="login-mensaje" hidden></p>

            </form>

        </section>

    </main>

    <script src="js/auth.js"></script>
</body>

</html>
